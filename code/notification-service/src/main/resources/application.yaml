spring:
  application:
    name: notification-service

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/notifymesh_db
    username: postgres
    password: saran2003
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 9090

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

aws:
  region: ap-south-1
  s3:
    bucket-name: notify-mesh-dynamic-attachments-dev

redis:
  cache:
    ttl:
      priority: 86400
      channel: 86400
      attachment-url: 900