spring:
  application:
    name: worker-service

  config:
    import: "optional:file:.env[.properties]"

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/notifymesh_db
    username: postgres
    password: saran2003
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9091

kafka:
  bootstrap-servers: localhost:9092
  consumer-group-id: worker-service
  topics:
    high: notification.priority.high
    medium: notification.priority.medium
    low: notification.priority.low

aws:
  region: ap-south-1
  s3:
    bucket-name: notify-mesh-dynamic-attachments-dev
